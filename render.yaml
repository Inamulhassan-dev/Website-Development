services:
  - type: web
    name: umar-baig-platform
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://umar-baig-platform.onrender.com
      - key: SESSION_TTL_DAYS
        value: "14"
      - key: AUTH_DEBUG_LOG_RESET_LINKS
        value: "true"
      - key: MEDIA_STORAGE
        value: local
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: umar-baig-db
          property: connectionString

databases:
  - name: umar-baig-db
    plan: free